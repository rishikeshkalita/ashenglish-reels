name: Deploy to Hugging Face Space

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Hugging Face Hub client
        run: python3 -m pip install --upgrade pip huggingface_hub

      - name: Verify token and upload README only
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: rishikeshkalita/ashenglish-reels
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error title=Missing HF token::HF_TOKEN secret is not set in GitHub Actions secrets."
            exit 1
          fi

          python3 - <<'PY'
import os
import sys
from huggingface_hub import HfApi

try:
    token = os.environ['HF_TOKEN']
    repo_id = os.environ['HF_SPACE']
    api = HfApi(token=token)
    who = api.whoami()
    print(f"Authenticated to Hugging Face as: {who.get('name') or who.get('fullname') or who}")

    api.upload_file(
        path_or_fileobj='README.md',
        path_in_repo='README.md',
        repo_id=repo_id,
        repo_type='space',
        commit_message='Sync README metadata from GitHub Actions',
    )
    print(f"README synced to https://huggingface.co/spaces/{repo_id}")
except Exception as exc:
    print(f"::error title=Hugging Face sync failed::{type(exc).__name__}: {exc}")
    raise
PY
