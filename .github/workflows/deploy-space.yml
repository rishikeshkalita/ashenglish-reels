name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade pip huggingface_hub

      - name: Upload repo contents to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: rishikeshkalita/ashenglish-reels
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not set. Add it in GitHub repo settings before running this workflow."
            exit 1
          fi

          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ['HF_TOKEN']
          repo_id = os.environ['HF_SPACE']

          api = HfApi(token=token)
          api.upload_folder(
              folder_path='.',
              repo_id=repo_id,
              repo_type='space',
              commit_message='Sync from GitHub Actions',
              ignore_patterns=[
                  '.git/*',
                  '.github/*',
                  '.venv/*',
                  'ffmpeg/*',
                  '__pycache__/*',
                  '*.pyc',
                  '*.pyo',
                  '*.pyd',
                  '*.log'
              ],
          )
          print(f'Synced repository to https://huggingface.co/spaces/{repo_id}')
          PY
