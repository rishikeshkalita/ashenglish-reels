name: Deploy to Hugging Face Space

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade pip huggingface_hub

      - name: Upload app files to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: rishikeshkalita/ashenglish-reels
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not set. Add it in GitHub repo settings before running this workflow."
            exit 1
          fi

          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ['HF_TOKEN']
          repo_id = os.environ['HF_SPACE']
          api = HfApi(token=token)

          files_to_upload = [
              'README.md',
              'app.py',
              'requirements.txt',
              'Dockerfile',
              'packages.txt',
              'runtime.txt',
              '.dockerignore',
              'assamese_dictionary.txt',
              'corrections.json',
              '.streamlit/config.toml',
          ]

          for local_path in files_to_upload:
              path_in_repo = local_path.replace('\\', '/')
              print(f'Uploading {local_path} -> {path_in_repo}')
              api.upload_file(
                  path_or_fileobj=local_path,
                  path_in_repo=path_in_repo,
                  repo_id=repo_id,
                  repo_type='space',
                  commit_message=f'Sync {path_in_repo} from GitHub Actions',
              )

          print(f'Synced repository to https://huggingface.co/spaces/{repo_id}')
          PY
